<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Image Mirror Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight bg-gradient-to-r from-sky-400 to-indigo-500 bg-clip-text text-transparent">
                Batch Image Mirror & Transform Tool
            </h1>
            <p class="text-slate-400 text-sm sm:text-base">
                Upload multiple images, flip them horizontally or vertically, rotate, and export individually or all at once.
            </p>
        </header>

        <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-sky-500 bg-slate-900/50 rounded-2xl p-8 sm:p-12 text-center cursor-pointer transition-all duration-200 group">
            <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
            <div class="max-w-sm mx-auto space-y-3">
                <div class="w-16 h-16 bg-slate-800 text-sky-400 rounded-full flex items-center justify-center mx-auto group-hover:scale-110 transition-transform">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                </div>
                <div class="text-slate-200 font-medium text-lg">
                    Drag & drop images here, or <span class="text-sky-400 underline">browse</span>
                </div>
                <p class="text-slate-500 text-xs">Supports PNG, JPG, WEBP, GIF, etc. (Multiple files allowed)</p>
            </div>
        </div>

        <div id="batchControls" class="hidden flex flex-wrap items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
            <div class="flex flex-wrap items-center gap-2">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 mr-2">Batch Actions:</span>
                <button onclick="batchAction('flipH')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-lg border border-slate-700 transition">
                    Flip All Horizontal
                </button>
                <button onclick="batchAction('flipV')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-lg border border-slate-700 transition">
                    Flip All Vertical
                </button>
                <button onclick="batchAction('rotate')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-lg border border-slate-700 transition">
                    Rotate All 90°
                </button>
                <button onclick="batchAction('reset')" class="bg-slate-800 hover:bg-slate-700 text-rose-400 text-xs font-medium px-3 py-2 rounded-lg border border-slate-700 transition">
                    Reset All
                </button>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="clearAllImages()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs font-medium px-3 py-2 rounded-lg border border-rose-500/20 transition">
                    Clear All
                </button>
                <button onclick="downloadAllImages()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-xs px-4 py-2 rounded-lg transition shadow-md">
                    Download All (.zip or batch)
                </button>
            </div>
        </div>

        <div id="imageGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamically injected cards will go here -->
        </div>

    </div>

    <script>
        let imagesState = [];

        const dropZone = document.getElementById('dropZone');
        const imageInput = document.getElementById('imageInput');
        const batchControls = document.getElementById('batchControls');
        const imageGrid = document.getElementById('imageGrid');

        // Drag and drop event listeners
        dropZone.addEventListener('click', () => imageInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-sky-500', 'bg-slate-900');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-sky-500', 'bg-slate-900');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-sky-500', 'bg-slate-900');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleFiles(e.target.files);
                imageInput.value = ''; // Reset input so same files can be re-selected if needed
            }
        });

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const imgObj = new Image();
                    imgObj.onload = () => {
                        const id = 'img_' + Math.random().toString(36.2) + Date.now();
                        imagesState.push({
                            id: id,
                            file: file,
                            name: file.name,
                            imgElement: imgObj,
                            width: imgObj.width,
                            height: imgObj.height,
                            flipH: false,
                            flipV: false,
                            rotation: 0 // 0, 90, 180, 270
                        });
                        renderGrid();
                    };
                    imgObj.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function renderGrid() {
            if (imagesState.length === 0) {
                batchControls.classList.add('hidden');
                imageGrid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-500 text-sm">
                        No images uploaded yet. Upload images above to get started.
                    </div>
                `;
                return;
            }

            batchControls.classList.remove('hidden');
            imageGrid.innerHTML = '';

            imagesState.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between shadow-md space-y-4";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between text-xs text-slate-400 border-b border-slate-800 pb-2">
                        <span class="truncate max-w-[200px] font-medium text-slate-300" title="${item.name}">${item.name}</span>
                        <span>${item.width} × ${item.height}px</span>
                    </div>

                    <div class="relative bg-slate-950 rounded-lg overflow-hidden flex items-center justify-center h-52 border border-slate-800">
                        <canvas id="canvas_${item.id}" class="max-h-full max-w-full object-contain"></canvas>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <button onclick="toggleFlip('${item.id}', 'h')" class="py-2 px-3 rounded-lg border ${item.flipH ? 'bg-sky-500/20 border-sky-500/50 text-sky-400 font-semibold' : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'} transition">
                            Flip H ${item.flipH ? '✓' : ''}
                        </button>
                        <button onclick="toggleFlip('${item.id}', 'v')" class="py-2 px-3 rounded-lg border ${item.flipV ? 'bg-sky-500/20 border-sky-500/50 text-sky-400 font-semibold' : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'} transition">
                            Flip V ${item.flipV ? '✓' : ''}
                        </button>
                    </div>

                    <div class="flex items-center gap-2">
                        <button onclick="rotateImage('${item.id}')" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 py-2 px-3 rounded-lg text-xs font-medium transition">
                            Rotate (90°)
                        </button>
                        <button onclick="resetImage('${item.id}')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 py-2 px-3 rounded-lg text-xs font-medium transition" title="Reset adjustments">
                            Reset
                        </button>
                        <button onclick="removeImage('${item.id}')" class="bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-400 py-2 px-3 rounded-lg text-xs font-medium transition" title="Remove image">
                            ✕
                        </button>
                    </div>

                    <button onclick="downloadSingle('${item.id}')" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold py-2 px-4 rounded-lg text-xs transition shadow">
                        Download Image
                    </button>
                `;

                imageGrid.appendChild(card);
                drawCanvas(item);
            });
        }

        function drawCanvas(item) {
            const canvas = document.getElementById(`canvas_${item.id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const isRotated90or270 = (item.rotation === 90 || item.rotation === 270);
            canvas.width = isRotated90or270 ? item.imgElement.height : item.imgElement.width;
            canvas.height = isRotated90or270 ? item.imgElement.width : item.imgElement.height;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            // Move to center for rotation and scaling transformations
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate((item.rotation * Math.PI) / 180);

            let scaleX = item.flipH ? -1 : 1;
            let scaleY = item.flipV ? -1 : 1;
            ctx.scale(scaleX, scaleY);

            ctx.drawImage(
                item.imgElement,
                -item.imgElement.width / 2,
                -item.imgElement.height / 2
            );

            ctx.restore();
        }

        function toggleFlip(id, direction) {
            const item = imagesState.find(i => i.id === id);
            if (!item) return;
            if (direction === 'h') item.flipH = !item.flipH;
            if (direction === 'v') item.flipV = !item.flipV;
            drawCanvas(item);
            renderGridStateOnly();
        }

        function rotateImage(id) {
            const item = imagesState.find(i => i.id === id);
            if (!item) return;
            item.rotation = (item.rotation + 90) % 360;
            renderGrid();
        }

        function resetImage(id) {
            const item = imagesState.find(i => i.id === id);
            if (!item) return;
            item.flipH = false;
            item.flipV = false;
            item.rotation = 0;
            renderGrid();
        }

        function removeImage(id) {
            imagesState = imagesState.filter(i => i.id !== id);
            renderGrid();
        }

        function clearAllImages() {
            imagesState = [];
            renderGrid();
        }

        function batchAction(action) {
            if (imagesState.length === 0) return;
            imagesState.forEach(item => {
                if (action === 'flipH') item.flipH = !item.flipH;
                if (action === 'flipV') item.flipV = !item.flipV;
                if (action === 'rotate') item.rotation = (item.rotation + 90) % 360;
                if (action === 'reset') {
                    item.flipH = false;
                    item.flipV = false;
                    item.rotation = 0;
                }
            });
            renderGrid();
        }

        function downloadSingle(id) {
            const item = imagesState.find(i => i.id === id);
            if (!item) return;
            const canvas = document.getElementById(`canvas_${item.id}`);
            if (!canvas) return;

            const link = document.createElement('a');
            const baseName = item.name.substring(0, item.name.lastIndexOf('.')) || 'image';
            link.download = `${baseName}_mirrored.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadAllImages() {
            if (imagesState.length === 0) return;
            // Sequentially trigger download for each image with a small delay to avoid browser block
            imagesState.forEach((item, index) => {
                setTimeout(() => {
                    const canvas = document.getElementById(`canvas_${item.id}`);
                    if (!canvas) return;
                    const link = document.createElement('a');
                    const baseName = item.name.substring(0, item.name.lastIndexOf('.')) || `image_${index + 1}`;
                    link.download = `${baseName}_transformed.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }, index * 300);
            });
        }

        // Lightweight re-render helper to update active button highlights without redrawing entire DOM loops if possible, 
        // though full renderGrid is fast enough for typical gallery sizes.
        function renderGridStateOnly() {
            imagesState.forEach(item => {
                drawCanvas(item);
            });
        }
    </script>

</body>
</html>
